services:
  postgres:
    image: postgres:16-alpine
    networks:
      - carsharing
    environment:
      POSTGRES_DB: carsharing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carsharing"]
      interval: 5s
      timeout: 5s
      retries: 10

